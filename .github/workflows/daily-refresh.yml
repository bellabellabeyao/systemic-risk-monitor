name: Daily refresh

on:
  schedule:
    - cron: "45 23 * * 0-4"   # 07:45 Singapore time, Mon-Fri
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-ci.txt
      - name: Run models (FRED + Yahoo)
        run: python -m sysrisk.pipeline --source free --out output
      - name: Build page
        run: python -m sysrisk.report --results output/results.pkl --out site/index.html --standalone
      - name: Keep the data alongside the page
        run: cp output/*.csv site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
